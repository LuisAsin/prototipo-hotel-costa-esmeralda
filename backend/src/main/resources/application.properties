# Aplicación
spring.application.name=costa-esmeralda

# Servidor: puerto 8080 y prefijo /api (sec. 3)
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always

# Jackson: hora de Lima, fechas ISO como texto y BigDecimal plano (contrato v2.2, sec. 1)
spring.jackson.time-zone=America/Lima
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.generator.write-bigdecimal-as-plain=true
# Los campos opcionales se envían como null, no se omiten
spring.jackson.default-property-inclusion=always

# Simulador de pagos: demora de SIN_RESPUESTA en milisegundos (sec. 9.2; en pruebas 0)
hotel.simulador.demora-ms=2000
# Pagos: tiempo tras el cual un pago PENDIENTE pasa a EN_VERIFICACION (T4)
hotel.pagos.umbral-pendiente=30s
